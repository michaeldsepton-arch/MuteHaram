name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Accept SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK packages
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python (model re-timing tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the benchmark models (download TIGER, re-time to shorter chunks)
        run: |
          pip install tflite numpy
          mkdir -p bench/src/main/assets
          curl -L --fail -o bench/src/main/assets/tiger_music_fp16.tflite             https://huggingface.co/litert-community/TIGER-DnR-LiteRT/resolve/main/tiger_music_fp16.tflite
          for T in 128 176 256; do
            python hook/research/retime/retime.py bench/src/main/assets/tiger_music_fp16.tflite               bench/src/main/assets/tiger_music_T$T.tflite --frames-old 1040 --frames-new $T
          done
          mkdir -p engine/src/main/assets
          cp bench/src/main/assets/tiger_music_T*.tflite engine/src/main/assets/
          ls -l bench/src/main/assets engine/src/main/assets

      - name: Unit-test the separation pipeline (pure Kotlin)
        run: gradle :separation:test :player:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APKs (all modules)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload capture-test APK
        uses: actions/upload-artifact@v4
        with:
          name: muteharam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload hook module APK
        uses: actions/upload-artifact@v4
        with:
          name: muteharam-hook-debug-apk
          path: hook/build/outputs/apk/debug/hook-debug.apk

      - name: Upload engine APK
        uses: actions/upload-artifact@v4
        with:
          name: muteharam-engine-debug-apk
          path: engine/build/outputs/apk/debug/engine-debug.apk

      - name: Upload tablet player APK
        uses: actions/upload-artifact@v4
        with:
          name: muteharam-player-debug-apk
          path: player/build/outputs/apk/debug/player-debug.apk

      - name: Upload benchmark APK
        uses: actions/upload-artifact@v4
        with:
          name: muteharam-bench-debug-apk
          path: bench/build/outputs/apk/debug/bench-debug.apk

      - name: Publish all APKs as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            hook/build/outputs/apk/debug/hook-debug.apk
            bench/build/outputs/apk/debug/bench-debug.apk
            engine/build/outputs/apk/debug/engine-debug.apk
            player/build/outputs/apk/debug/player-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Real-model cross-check: the Kotlin pipeline against the real Python Wi-Fi server (CPU).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the PC engine (CPU PyTorch + model weights)
        working-directory: pc
        run: python setup_pc.py --no-venv --cpu --skip-tools --no-bandit

      - name: Python tests (server + protocol bytes)
        working-directory: pc
        run: |
          python tests/test_protocol_golden.py
          python tests/test_stream_server.py
          python tests/test_tablet_server.py

      - name: Start the Wi-Fi server
        working-directory: pc
        run: |
          nohup python -m muteharam_pc.stream_server --no-token --cpu --port 47801 > server.log 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/47801) 2>/dev/null && break; sleep 2; done
          cat server.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get a real movie clip (TIGER's own test file)
        run: curl -L --fail -o clip.wav https://raw.githubusercontent.com/JusperLee/TIGER/main/test/test_mixture_466.wav

      - name: Kotlin pipeline vs the real server (+ render the clip through it)
        env:
          MUTEHARAM_SERVER: "127.0.0.1:47801"
          MUTEHARAM_CLIP: ${{ github.workspace }}/clip.wav
          MUTEHARAM_OUT: ${{ github.workspace }}/android_pipeline_demo
          MUTEHARAM_SECONDS: "20"
        run: gradle :separation:test --tests '*LiveServerTest*' --tests '*RenderDemoTest*' --no-daemon --stacktrace

      - name: Upload what the Android pipeline sounds like
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pipeline-demo-audio
          path: android_pipeline_demo/
          if-no-files-found: ignore

      - name: Server log
        if: always()
        run: cat pc/server.log || true
