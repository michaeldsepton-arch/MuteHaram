# MuteHaram player settings (used with --config-dir when the uosc add-on is installed).
# uosc replaces mpv's plain on-screen controls: it shows buttons with tooltips and
# appears whenever the mouse moves anywhere over the video.
osc=no
osd-bar=no
# hide the mouse cursor (and the controls, see uosc.conf autohide) after 2.5 s without movement
cursor-autohide=2500
cursor-autohide-fs-only=no
# drag the window by holding the left button on the picture
window-dragging=yes

# Captions: show them automatically in these languages when the video has them
# (the uosc "subtitles" button lets you switch or turn them off).
slang=en,eng,ar,ara
sid=auto
sub-auto=fuzzy
