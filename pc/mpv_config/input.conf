# Click anywhere on the picture to pause / resume; double-click for fullscreen.
MBTN_LEFT       cycle pause
MBTN_LEFT_DBL   cycle fullscreen
# Right-click opens uosc's context menu (tracks, speed, ...)
MBTN_RIGHT      script-binding uosc/menu
# Mouse wheel: volume
WHEEL_UP        add volume 5
WHEEL_DOWN      add volume -5
# Keyboard: space pause, arrows seek, f fullscreen, m mute, p small window (MuteHaram)
