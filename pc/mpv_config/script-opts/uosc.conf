# Only the settings we change; everything else uses uosc's defaults.
# Show the controls whenever the cursor is visible (any mouse movement), hide with it.
autohide=yes
# Briefly show a pause/play symbol in the middle when you click.
pause_indicator=flash
# Treat the whole window as "close to" the controls, so they fade in on any mouse movement
# (with autohide=yes they disappear again together with the cursor).
proximity_in=4000
proximity_out=5000
