# Only the settings we change; everything else uses uosc's defaults.
# Show the controls whenever the cursor is visible (any mouse movement), hide with it.
autohide=yes
# Briefly show a pause/play symbol in the middle when you click.
pause_indicator=flash
# Treat the whole window as "close to" the controls, so they fade in on any mouse movement
# (with autohide=yes they disappear again together with the cursor).
proximity_in=4000
proximity_out=5000
# The default controls plus a MuteHaram button (switch: remove the music / speech only). Same as pressing C.
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,command:record_voice_over:script-binding mpv_mode/muteharam-mode?Cleaning: music / speech only,gap,fullscreen
